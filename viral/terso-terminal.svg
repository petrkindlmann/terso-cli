<svg width="800" height="520" viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <rect width="800" height="520" rx="10" fill="#0d1117"/>
  <rect width="800" height="44" rx="10" fill="#161b22"/>
  <rect y="22" width="800" height="22" fill="#161b22"/>
  <line x1="0" y1="44" x2="800" y2="44" stroke="#21262d" stroke-width="1"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="22" r="6" fill="#27c93f"/>
  <text x="400" y="27" fill="#7d8590" font-size="13" text-anchor="middle">checkout-service — terso</text>
  <g font-size="15">
    <!-- 1. emit -->
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.02;0.03;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="24" y="80" fill="#3fb950">$</text><text x="42" y="80" fill="#e6edf3">terso emit</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.07;0.08;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="42" y="104" fill="#3fb950">create</text><text x="120" y="104" fill="#e6edf3">CLAUDE.md</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.09;0.10;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="42" y="124" fill="#3fb950">create</text><text x="120" y="124" fill="#e6edf3">.cursorrules</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.11;0.12;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="42" y="144" fill="#3fb950">create</text><text x="120" y="144" fill="#e6edf3">.github/copilot-instructions.md</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.14;0.15;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="24" y="172" fill="#7d8590">Emitted 3 file(s) from AGENTS.md.</text></g>

    <!-- 2. a config drifts; the check gate catches it -->
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.24;0.25;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="24" y="212" fill="#484f58" font-size="13"># someone hand-edits .cursorrules, AGENTS.md moves on…</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.28;0.29;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="24" y="240" fill="#3fb950">$</text><text x="42" y="240" fill="#e6edf3">terso emit --check</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.33;0.34;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="42" y="264" fill="#f85149">drift</text><text x="120" y="264" fill="#e6edf3">CLAUDE.md</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.35;0.36;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="42" y="284" fill="#f85149">drift</text><text x="120" y="284" fill="#e6edf3">.cursorrules</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.37;0.38;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="42" y="304" fill="#f85149">drift</text><text x="120" y="304" fill="#e6edf3">.github/copilot-instructions.md</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.41;0.42;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="24" y="332" fill="#f85149">3 file(s) out of date. Run `terso emit`.</text>
      <text x="24" y="354" fill="#da3633" font-size="13">exit 1 — CI gate blocks the merge</text></g>

    <!-- 3. re-emit, gate passes -->
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.55;0.56;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="24" y="394" fill="#3fb950">$</text><text x="42" y="394" fill="#e6edf3">terso emit &amp;&amp; terso emit --check</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.62;0.63;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="42" y="418" fill="#7d8590">ok</text><text x="120" y="418" fill="#e6edf3">CLAUDE.md</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.64;0.65;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="42" y="438" fill="#7d8590">ok</text><text x="120" y="438" fill="#e6edf3">.cursorrules</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.66;0.67;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="42" y="458" fill="#7d8590">ok</text><text x="120" y="458" fill="#e6edf3">.github/copilot-instructions.md</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.70;0.71;0.96;0.98;1" dur="13s" repeatCount="indefinite"/>
      <text x="24" y="486" fill="#3fb950">&#10003; All 3 target(s) up to date.</text>
      <text x="24" y="508" fill="#484f58" font-size="13">exit 0 — CI gate passes</text></g>

    <!-- blinking prompt cursor, only during the idle tail -->
    <rect x="42" y="494" width="9" height="16" fill="#e6edf3"><animate attributeName="opacity" values="0;0;1;0;1;0" keyTimes="0;0.90;0.92;0.95;0.97;1" dur="13s" repeatCount="indefinite"/></rect>
  </g>
</svg>
