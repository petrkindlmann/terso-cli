name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs so rapid pushes don't stack up the full OS matrix.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full 3-OS x 2-Node matrix only on main pushes (where cross-platform
  # regressions actually ship). PRs run Linux + Node 22 only — macOS bills at
  # 10x and Windows at 2x the Linux rate, so the cross-OS sweep on every WIP
  # commit was the main cost driver.
  matrix-config:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
      node: ${{ steps.pick.outputs.node }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'node=[20,22]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'node=[22]' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    needs: matrix-config
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix-config.outputs.os) }}
        node: ${{ fromJSON(needs.matrix-config.outputs.node) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TERSO_SUPPRESS_BETA_NOTICE: '1'

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage
        env:
          TERSO_SUPPRESS_BETA_NOTICE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev

  offline-emit-gate:
    name: offline-emit import gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: emit path must not import api-client
        shell: bash
        run: |
          set -euo pipefail
          if grep -RnE "api-client|OmnusApiClient|node:http|node:net|fetch\\(" src/commands/emit.ts src/lib/agent-targets.ts; then
            echo "::error::Emit code path imports network code. Surface A must stay offline."
            exit 1
          fi
          echo "Offline gate clean."
